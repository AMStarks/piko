# shellcheck shell=bash
# Tenant deployment targets for release.sh / rollback.sh.
# tenant_load <tenant> sets: T_HOST T_ROOT_HOST T_DIR T_SERVICE T_SERVICE_SCOPE T_HEALTH_URL T_PORT

tenant_load() {
  case "$1" in
    customer-03|ei)
      T_HOST="optimus-wan"
      T_ROOT_HOST="optimus-wan"          # user-scope service; root not needed
      T_DIR="/home/chief/webchat-piko-customer-03"
      T_SERVICE="piko-webchat-customer-03.service"
      T_WORKER_SERVICE="piko-worker-customer-03.service"
      T_SERVICE_SCOPE="user"
      T_PORT=3021
      T_HEALTH_URL="http://127.0.0.1:3021/api/health"
      ;;
    customer-01|ausmaker)
      T_HOST="rodimus-wan"
      T_ROOT_HOST="rodimus-wan-root"     # system service restart needs root
      T_DIR="/home/chief/webchat-piko"
      T_SERVICE="piko-webchat.service"
      T_WORKER_SERVICE="piko-worker.service"
      T_SERVICE_SCOPE="system"
      T_PORT=3000
      T_HEALTH_URL="http://127.0.0.1:3000/api/health"
      ;;
    *)
      echo "unknown tenant: $1 (known: customer-03/ei, customer-01/ausmaker)" >&2
      return 1
      ;;
  esac
}
