[Service]
# Load .env so TELEGRAM_*, GMAIL_*, BLUEBUBBLES_*, etc. are available to the server
EnvironmentFile=-/root/webchat-piko/.env
# Integration toggles (Control → Integrations)
Environment=PIKO_DAILY_MEMORY_ENABLED=1
Environment=PIKO_EA_USE_LLM_SYNTHESIS=1
Environment=PIKO_EA_PREP_MEETING=1
Environment=PIKO_EA_GMAIL_READ_BODY=1
