<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piko — WebChat</title>
  <style>
    :root {
      --bg: #1a1b1e;
      --surface: #25262a;
      --border: #3d3f44;
      --text: #e4e4e7;
      --text-dim: #a1a1aa;
      --accent: #7c9cbf;
      --user-bg: #2d2e33;
      --assistant-bg: #25262a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    header button {
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    header button:hover { background: var(--accent); color: var(--bg); }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      border: 1px solid var(--border);
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant-bg);
      border: 1px solid var(--border);
    }
    .msg .role { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.25rem; }
    .msg.writing {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--text-dim);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      max-width: fit-content;
    }
    .msg.writing .writing-icon {
      display: inline-grid;
      place-items: center;
      animation: piko-write-bob 0.9s ease-in-out infinite;
      transform-origin: 50% 80%;
    }
    .msg.writing .writing-dots span {
      display: inline-block;
      width: 5px;
      height: 5px;
      margin-left: 3px;
      background: var(--text-dim);
      border-radius: 50%;
      opacity: 0.45;
      animation: piko-write-dot 1.2s ease-in-out infinite;
    }
    .msg.writing .writing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .msg.writing .writing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes piko-write-bob {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-5px) rotate(8deg); }
    }
    @keyframes piko-write-dot {
      0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }
    #form {
      padding: 1rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    #form form {
      display: flex;
      gap: 0.5rem;
      max-width: 800px;
      margin: 0 auto;
    }
    #input {
      flex: 1;
      min-height: 44px;
      padding: 0.6rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      resize: none;
    }
    #input:focus { outline: none; border-color: var(--accent); }
    #send {
      padding: 0.6rem 1.2rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    #send:hover { filter: brightness(1.1); }
    #send:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { color: var(--text-dim); font-size: 0.85rem; padding: 0.25rem 0; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <header>
    <h1>Piko</h1>
    <span style="display:flex;gap:0.5rem;align-items:center;">
      <button type="button" id="voiceBtn" title="Voice input (Web Speech API)">🎤 Voice</button>
      <button type="button" id="newChat">New chat</button>
      <a href="/command-centre" style="font-size:0.85rem;color:var(--text-dim);text-decoration:none;margin-right:0.75rem;">Command Centre</a>
      <a href="/control" style="font-size:0.85rem;color:var(--text-dim);text-decoration:none;">Control</a>
    </span>
  </header>
  <div id="messages"></div>
  <div id="form">
    <form id="chatForm">
      <textarea id="input" rows="1" placeholder="Message Piko…" required></textarea>
      <button type="submit" id="send">Send</button>
    </form>
    <div id="status" class="status"></div>
  </div>
  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const statusEl = document.getElementById('status');
    const newChatBtn = document.getElementById('newChat');

    const LS_SESSION = 'piko_webchat_session:' + (location.pathname || '/');
    function newSessionId() {
      // Prefix webchat- so session ids never look like telegram-/ios- channels.
      const raw = crypto.randomUUID ? crypto.randomUUID().split('-').join('') : String(Date.now());
      return 'webchat-' + raw;
    }
    function loadStoredSessionId() {
      try {
        const sid = localStorage.getItem(LS_SESSION);
        if (sid && String(sid).trim()) return String(sid).trim();
      } catch (_) { /* ignore */ }
      return null;
    }
    function persistSessionId(sid) {
      try { localStorage.setItem(LS_SESSION, sid); } catch (_) { /* ignore */ }
    }
    let sessionId = loadStoredSessionId() || newSessionId();
    persistSessionId(sessionId);

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.className = 'status' + (isError ? ' error' : '');
    }

    // P6.3: under PIKO_API_AUTH=strict, chat needs an admin session cookie.
    function loginUrl() {
      const next = encodeURIComponent(location.pathname + location.search || '/');
      return '/admin/login?next=' + next;
    }
    function promptLogin(reason) {
      const why = reason || 'Sign in required';
      setStatus(why + ' — open admin login to chat.', true);
      statusEl.innerHTML = '';
      const span = document.createElement('span');
      span.textContent = why + ' — ';
      const a = document.createElement('a');
      a.href = loginUrl();
      a.textContent = 'Sign in to chat';
      a.style.color = 'var(--accent, #6cf)';
      statusEl.appendChild(span);
      statusEl.appendChild(a);
      statusEl.className = 'status error';
    }
    async function apiFetch(path, opts) {
      const res = await fetch(path, { credentials: 'include', ...(opts || {}) });
      if (res.status === 401) {
        promptLogin('Unauthorized');
      }
      return res;
    }

    function appendMessage(role, content) {
      hideWriting();
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      const roleLabel = document.createElement('div');
      roleLabel.className = 'role';
      roleLabel.textContent = role === 'user' ? 'You' : 'Piko';
      div.appendChild(roleLabel);
      const pre = document.createElement('div');
      pre.textContent = content;
      div.appendChild(pre);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showWriting() {
      hideWriting();
      const div = document.createElement('div');
      div.className = 'msg assistant writing';
      div.id = 'writing-indicator';
      div.setAttribute('aria-live', 'polite');
      div.setAttribute('aria-label', 'Piko is writing');
      div.innerHTML = '<span class="writing-icon" aria-hidden="true">✎</span><span>Writing</span><span class="writing-dots" aria-hidden="true"><span></span><span></span><span></span></span>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideWriting() {
      const el = document.getElementById('writing-indicator');
      if (el) el.remove();
    }

    async function loadChatHistory() {
      try {
        const res = await apiFetch('/api/chat/history?sessionId=' + encodeURIComponent(sessionId));
        if (res.status === 401) return;
        if (!res.ok) return;
        const data = await res.json();
        const msgs = (data && data.messages) || [];
        if (!msgs.length) return;
        messagesEl.innerHTML = '';
        for (const m of msgs) {
          if (!m || (m.role !== 'user' && m.role !== 'assistant')) continue;
          if (m.role === 'assistant') shownAssistant.add(m.content || '');
          appendMessage(m.role, m.content || '');
        }
      } catch (_) { /* ignore */ }
    }

    function extractJobId(text) {
      const m = String(text || '').match(/\bJob:\s*(job_[A-Za-z0-9_-]+)/);
      return m ? m[1] : null;
    }

    let jobWatchTimer = null;
    const shownAssistant = new Set();

    function stopJobWatch() {
      if (jobWatchTimer) {
        clearInterval(jobWatchTimer);
        jobWatchTimer = null;
      }
    }

    function startJobWatch(jobId) {
      stopJobWatch();
      let ticks = 0;
      const maxTicks = 180; // ~6 min at 2s
      setStatus('Worker running — live progress…');
      jobWatchTimer = setInterval(async () => {
        ticks += 1;
        try {
          const histRes = await apiFetch('/api/chat/history?sessionId=' + encodeURIComponent(sessionId));
          if (histRes.ok) {
            const data = await histRes.json();
            const msgs = (data && data.messages) || [];
            for (const m of msgs) {
              if (!m || m.role !== 'assistant') continue;
              const content = m.content || '';
              if (shownAssistant.has(content)) continue;
              shownAssistant.add(content);
              appendMessage('assistant', content);
            }
          }
          if (jobId) {
            const jobRes = await apiFetch('/api/agents/jobs/' + encodeURIComponent(jobId));
            if (jobRes.ok) {
              const body = await jobRes.json();
              const job = body && body.job;
              if (job && job.status === 'done') {
                stopJobWatch();
                setStatus('');
                return;
              }
            }
          }
        } catch (_) { /* ignore */ }
        if (ticks >= maxTicks) {
          stopJobWatch();
          setStatus('Still working in the background — refresh history or /agents status.');
        }
      }, 2000);
    }

    async function sendMessage(text) {
      if (window.isSendingRequest) {
        console.warn('Attempted to send message while previous request is still in flight. Ignoring.');
        return;
      }
      if (!text.trim()) return;
      window.isSendingRequest = true;
      sendBtn.disabled = true;
      input.disabled = true;
      input.placeholder = 'Piko is writing…';
      appendMessage('user', text.trim());
      input.value = '';
      setStatus('Piko is writing…');
      showWriting();

      try {
        const res = await apiFetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text.trim(), sessionId }),
        });
        if (res.status === 401) {
          hideWriting();
          return;
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          hideWriting();
          setStatus(data.error || 'Request failed', true);
          return;
        }
        const reply = data.reply || '';
        shownAssistant.add(reply);
        appendMessage('assistant', reply);
        setStatus('');
        const jobId = extractJobId(reply);
        if (jobId || (data.legate && data.legate.mode === 'dispatch')) {
          startJobWatch(jobId || extractJobId(reply));
        }
      } catch (e) {
        hideWriting();
        setStatus('Network error: ' + e.message, true);
      } finally {
        hideWriting();
        window.isSendingRequest = false;
        sendBtn.disabled = false;
        input.disabled = false;
        input.placeholder = 'Message Piko…';
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.metaKey) {
        e.preventDefault();
        sendMessage(input.value);
      }
    });

    newChatBtn.addEventListener('click', async () => {
      try {
        const res = await apiFetch('/api/chat/history?sessionId=' + encodeURIComponent(sessionId), { method: 'DELETE' });
        if (res.status === 401) return;
      } catch (_) { /* ignore */ }
      sessionId = newSessionId();
      persistSessionId(sessionId);
      messagesEl.innerHTML = '';
      shownAssistant.clear();
      stopJobWatch();
      setStatus('New chat started.');
      setTimeout(() => setStatus(''), 2000);
    });

    loadChatHistory();

    // Phase 4: Voice input (Web Speech API)
    const voiceBtn = document.getElementById('voiceBtn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      recognition.onresult = (e) => {
        const t = e.results[e.results.length - 1][0].transcript;
        if (t && t.trim()) sendMessage(t.trim());
      };
      recognition.onerror = () => setStatus('Voice error. Try again.', true);
      recognition.onend = () => { voiceBtn.textContent = '🎤 Voice'; voiceBtn.disabled = false; };
    } else {
      voiceBtn.disabled = true;
      voiceBtn.title = 'Voice not supported in this browser';
    }
    voiceBtn.addEventListener('click', () => {
      if (!recognition || window.isSendingRequest) return;
      voiceBtn.textContent = 'Listening…';
      voiceBtn.disabled = true;
      setStatus('Listening…');
      try {
        recognition.start();
      } catch (err) {
        setStatus('Voice error: ' + err.message, true);
        voiceBtn.textContent = '🎤 Voice';
        voiceBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
